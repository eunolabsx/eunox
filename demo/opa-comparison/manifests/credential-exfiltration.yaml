#
# Scenario 1 — Credential exfiltration
#
# An agent may read credentials, and it may write to an external destination —
# but it may NOT do both in sequence. Once read_credentials has run this
# session, write_external is denied. This is cross-tool sequencing ("deny B
# after A"), which OPA cannot express because it has no memory of what ran
# before in the session.
schemaVersion: "0.1"
name: opa-comparison-credential-exfiltration
version: "0.1.0"

capabilities:
  - target: tool:read_credentials
    actions: [call]

  - target: tool:write_external
    actions: [call]
    conditions:
      - type: sequenceBlock
        afterTools: [read_credentials]
