name: Adoption signals

# Weekly snapshot of public adoption data — release downloads, traffic,
# issue/PR activity, public manifests, forks. No client-side telemetry
# is collected (see SECURITY.md). All inputs are public APIs.
#
# The report is uploaded as an artifact with 90-day retention. Download
# the latest from the Actions tab. See scripts/signals/README.md for
# interpretation notes.

on:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq

      - name: Collect signals
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          OUT="signals-$(date -u +%Y-%m-%d).md"
          bash ./scripts/signals/collect.sh > "$OUT"
          {
            echo "## Adoption signals report"
            echo
            echo "Generated from \`scripts/signals/collect.sh\`. The full"
            echo "report is also available as the \`adoption-signals\`"
            echo "artifact on this run."
            echo
            cat "$OUT"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: adoption-signals
          path: ${{ env.OUT }}
          retention-days: 90
          if-no-files-found: error
